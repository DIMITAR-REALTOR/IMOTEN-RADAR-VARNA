name: Scraper - Вторник и Петък

on:
  schedule:
    - cron: '0 9 * * 2,5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Browsers
        uses: microsoft/playwright-github-action@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        timeout-minutes: 10
        env:
          OLX_EMAIL: ${{ secrets.OLX_EMAIL }}
          OLX_PASSWORD: ${{ secrets.OLX_PASSWORD }}
        run: python scraper.py

      - name: Save CSV to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add data/properties_varna.csv
          git diff --cached --quiet || (git commit -m "📊 Обяви $(date +'%d.%m.%Y')" && git push)
