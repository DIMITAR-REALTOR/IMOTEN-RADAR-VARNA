name: Scraper - Вторник и Петък

on:
  schedule:
    - cron: '0 9 * * 2,5' # Вторник и Петък в 09:00 UTC
  workflow_dispatch:      # Позволява ръчно стартиране

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Инсталиране на системни зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libpangocairo-1.0-0 libcairo2

      - name: Инсталиране на Python библиотеки и Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Стартиране на скрейпър
        env:
          OLX_EMAIL: ${{ secrets.OLX_EMAIL }}
          OLX_PASSWORD: ${{ secrets.OLX_PASSWORD }}
        run: python scraper.py

      - name: Запазване на CSV в репото
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add data/properties_varna.csv
          git diff --cached --quiet || (git commit -m "📊 Обяви $(date +'%d.%m.%Y')" && git push)
