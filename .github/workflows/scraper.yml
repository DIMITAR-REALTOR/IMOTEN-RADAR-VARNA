name: Scraper - Всеки ден

concurrency:
  group: imoten-radar-daily-scrape
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libpangocairo-1.0-0 libcairo2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        timeout-minutes: 300
        env:
          MAX_PAGES: 20
          MAX_ALO_PAGES: 20
          MAX_IMOT_PAGES: 40
          MAX_OLX_PAGES: 40
          SCRAPE_ALO: "1"
          SCRAPE_IMOT: "1"
          SCRAPE_OLX: "1"
          OLX_FETCH_PHONES: "0"
          IMOT_EMAIL: ${{ secrets.IMOT_EMAIL }}
          IMOT_PASSWORD: ${{ secrets.IMOT_PASSWORD }}
          PYTHONUNBUFFERED: "1"
          DROP_THRESHOLD_PERCENT: "30"
          MIN_LISTINGS: "50"
          PHOTO_RETENTION_DAYS: "14"
        run: python -u scraper.py

      - name: Генериране на радар (docs/index.html)
        if: success()
        run: python -u scripts/build_radar.py

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics
          path: |
            data/scrape_report.json
            data/olx_login_debug.png
            data/olx_login_debug.html
            data/alo_*_debug.png
            data/alo_*_debug.html
            data/imot_*_debug.png
            data/imot_*_debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Save CSV to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add data/properties_varna.csv data/history/ data/photos/ docs/ data/manual_property_corrections.csv data/last_full_snapshot.json
          if git diff --cached --quiet; then
            echo "Няма промени за публикуване"
          else
            git commit -m "📊 Обяви $(date +'%d.%m.%Y')"
            git push
          fi

      - name: Съдържане на обявите в REMI AI
        if: success()
        env:
          REMI_API_URL: ${{ secrets.REMI_API_URL }}
          REMI_INGESTION_SECRET: ${{ secrets.REMI_INGESTION_SECRET }}
        run: python -u scripts/sync_to_remi.py
