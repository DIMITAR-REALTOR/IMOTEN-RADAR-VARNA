name: Scraper - Вторник и Петък

on:
  schedule:
    - cron: '0 9 * * 2,5' # Вторник и Петък в 09:00 UTC
  workflow_dispatch:      # Позволява ръчно стартиране

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Инсталиране на библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Стартиране на скрейпър
        env:
          OLX_EMAIL: ${{ secrets.OLX_EMAIL }}
          OLX_PASSWORD: ${{ secrets.OLX_PASSWORD }}
        run: python scraper.py

      - name: Запазване на CSV в репото
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/properties_varna.csv
          git diff --cached --quiet || (git commit -m "📊 Обяви $(date +'%d.%m.%Y')" && git push)
