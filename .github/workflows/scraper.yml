name: Scraper - Всеки ден

concurrency:
  group: imoten-radar-daily-scrape
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-non-olx:
    name: Обход imot.bg + ALO.bg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system dependencies and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libpangocairo-1.0-0 libcairo2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape imot.bg and ALO.bg into a temporary partition
        timeout-minutes: 55
        env:
          MAX_PAGES: 20
          MAX_ALO_PAGES: 20
          MAX_IMOT_PAGES: 40
          MAX_OLX_PAGES: 0
          MAX_OLX_PRIVATE_PAGES: 0
          MAX_OLX_PRIVATE_RENT_PAGES: 0
          MAX_OLX_AGENCY_PAGES: 0
          SCRAPE_ALO: '1'
          SCRAPE_IMOT: '1'
          SCRAPE_OLX: '0'
          SCRAPE_STAGING_ONLY: '1'
          SCRAPE_STAGE_OUTPUT: data/staging/non_olx.csv
          SCRAPE_REPORT_PATH: data/staging/non_olx_report.json
          SCRAPE_CHECKPOINT_DIR: data/staging/checkpoints
          IMOT_EMAIL: ${{ secrets.IMOT_EMAIL }}
          IMOT_PASSWORD: ${{ secrets.IMOT_PASSWORD }}
          PYTHONUNBUFFERED: '1'
          DROP_THRESHOLD_PERCENT: '30'
          MIN_LISTINGS: '50'
          PHOTO_RETENTION_DAYS: '14'
        run: python -u scraper.py

      - name: Summarize non-OLX scrape diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("data/staging/non_olx_report.json")
          if not path.exists():
              print("Non-OLX report was not produced.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Non-OLX scrape diagnostics\n\n")
                  for site, entry in report.get("sites", {}).items():
                      summary.write(f"- **{site}**: {entry.get('status')}; "
                                    f"{entry.get('listings', 0)} listings; "
                                    f"{entry.get('pages', 0)} pages; "
                                    f"limit={entry.get('limit_reached', False)}; "
                                    f"timeouts={entry.get('timeouts', 0)}; "
                                    f"parse errors={entry.get('parse_errors', 0)}\n")
                      for deal, coverage in entry.get("agency_coverage", {}).items():
                          summary.write(f"  - {deal}: {coverage.get('observed_unique', 0)} "
                                        f"уникални / {coverage.get('root_total', 'неизвестен')} "
                                        f"от OLX; verified={coverage.get('verified', False)}; "
                                        f"{coverage.get('reason', '')}\n")
                  for error in report.get("errors", []):
                      summary.write(f"\n- ⚠️ {error}")
          PY

      - name: Upload imot.bg + ALO.bg partition
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-non-olx
          path: |
            data/staging/non_olx.csv
            data/staging/non_olx_report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload non-OLX diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scraper-diagnostics-non-olx
          path: |
            data/staging/non_olx_report.json
            data/alo_*_debug.png
            data/alo_*_debug.html
            data/imot_*_debug.png
            data/imot_*_debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload non-OLX listing checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-checkpoints-non-olx
          path: data/staging/checkpoints/
          if-no-files-found: ignore
          retention-days: 90

  scrape-olx:
    name: Обход OLX.bg (самостоятелен максимум)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system dependencies and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libpangocairo-1.0-0 libcairo2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape OLX.bg into a temporary partition
        timeout-minutes: 350
        env:
          MAX_PAGES: 20
          MAX_ALO_PAGES: 0
          MAX_IMOT_PAGES: 0
          MAX_OLX_PAGES: 65
          MAX_OLX_PRIVATE_PAGES: 10
          MAX_OLX_PRIVATE_RENT_PAGES: 15
          MAX_OLX_AGENCY_PAGES: 30
          SCRAPE_ALO: '0'
          SCRAPE_IMOT: '0'
          SCRAPE_OLX: '1'
          SCRAPE_STAGING_ONLY: '1'
          SCRAPE_STAGE_OUTPUT: data/staging/olx.csv
          SCRAPE_REPORT_PATH: data/staging/olx_report.json
          SCRAPE_CHECKPOINT_DIR: data/staging/checkpoints
          OLX_FETCH_PHONES: '0'
          PYTHONUNBUFFERED: '1'
          DROP_THRESHOLD_PERCENT: '30'
          MIN_LISTINGS: '50'
          PHOTO_RETENTION_DAYS: '14'
        run: python -u scraper.py

      - name: Summarize OLX scrape diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("data/staging/olx_report.json")
          if not path.exists():
              print("OLX report was not produced.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## OLX scrape diagnostics\n\n")
                  for site, entry in report.get("sites", {}).items():
                      summary.write(f"- **{site}**: {entry.get('status')}; "
                                    f"{entry.get('listings', 0)} listings; "
                                    f"{entry.get('pages', 0)} pages; "
                                    f"limit={entry.get('limit_reached', False)}; "
                                    f"timeouts={entry.get('timeouts', 0)}; "
                                    f"parse errors={entry.get('parse_errors', 0)}\n")
                      for deal, coverage in entry.get("agency_coverage", {}).items():
                          summary.write(f"  - {deal}: {coverage.get('observed_unique', 0)} "
                                        f"уникални / {coverage.get('root_total', 'неизвестен')} "
                                        f"от OLX; verified={coverage.get('verified', False)}; "
                                        f"{coverage.get('reason', '')}\n")
                  for error in report.get("errors", []):
                      summary.write(f"\n- ⚠️ {error}")
          PY

      - name: Upload OLX partition
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-olx
          path: |
            data/staging/olx.csv
            data/staging/olx_report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload OLX diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scraper-diagnostics-olx
          path: |
            data/staging/olx_report.json
            data/olx_login_debug.png
            data/olx_login_debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload OLX listing checkpoints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-checkpoints-olx
          path: data/staging/checkpoints/
          if-no-files-found: ignore
          retention-days: 90

  archive-partial-checkpoints:
    name: Архивиране на checkpoint-и при неуспешен обход
    if: always()
    needs: [scrape-non-olx, scrape-olx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download non-OLX checkpoints
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scrape-checkpoints-non-olx
          path: data/scrape_checkpoints/run-${{ github.run_id }}/non_olx

      - name: Download OLX checkpoints
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scrape-checkpoints-olx
          path: data/scrape_checkpoints/run-${{ github.run_id }}/olx

      - name: Archive partial listing data without replacing history
        env:
          NON_OLX_RESULT: ${{ needs.scrape-non-olx.result }}
          OLX_RESULT: ${{ needs.scrape-olx.result }}
        run: |
          if [[ "$NON_OLX_RESULT" == "success" && "$OLX_RESULT" == "success" ]]; then
            echo "Both scrape jobs succeeded; no partial checkpoint archive is needed."
            exit 0
          fi
          archive="data/scrape_checkpoints/run-${GITHUB_RUN_ID}"
          if ! find "$archive" -type f -name '*.jsonl' -print -quit 2>/dev/null | grep -q .; then
            echo "No parsed listing checkpoints were produced."
            exit 0
          fi
          while IFS= read -r file; do
            gzip -n "$file"
          done < <(find "$archive" -type f -name '*.jsonl' -print)
          git add -- "$archive"
          changes="$(git diff --cached --name-status -- "$archive")"
          while IFS=$'\t' read -r status path; do
            [[ -z "$status" ]] && continue
            if [[ "$status" != "A" ]]; then
              echo "ERROR: checkpoint archive is append-only; refusing $status $path"
              exit 1
            fi
          done <<< "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git commit -m "data: archive partial scrape ${GITHUB_RUN_ID}"
          git push

  merge-and-publish:
    name: Обединяване, проверка и публикация
    if: always()
    needs: [scrape-non-olx, scrape-olx, archive-partial-checkpoints]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download imot.bg + ALO.bg partition
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scrape-non-olx
          path: data/staging

      - name: Download non-OLX diagnostics
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scraper-diagnostics-non-olx
          path: data/staging/diagnostics_non_olx

      - name: Download OLX partition
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scrape-olx
          path: data/staging

      - name: Download OLX diagnostics
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: scraper-diagnostics-olx
          path: data/staging/diagnostics_olx

      - name: Merge, validate, and publish the full snapshot
        env:
          DROP_THRESHOLD_PERCENT: '30'
          MIN_LISTINGS: '50'
          PHOTO_RETENTION_DAYS: '14'
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/merge_scrape_partitions.py

      - name: Генериране на радар (docs/index.html)
        run: python -u scripts/build_radar.py

      - name: Upload final scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scraper-diagnostics-final
          path: data/scrape_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save CSV to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add data/properties_varna.csv data/history/ data/photos/ docs/ data/manual_property_corrections.csv data/last_full_snapshot.json
          git add data/source_snapshot_status.json
          data_changes="$(git diff --cached --name-status -- data/)"
          if [[ -n "$data_changes" ]]; then
            while IFS=$'\t' read -r status path; do
              if [[ "$status" == "D" || "$status" == R* ]]; then
                echo "ERROR: data is never deleted or renamed automatically; refusing $status $path"
                exit 1
              fi
            done <<< "$data_changes"
          fi
          photo_changes="$(git diff --cached --name-status -- data/photos/)"
          if [[ -n "$photo_changes" ]]; then
            while IFS=$'\t' read -r status path; do
              if [[ "$status" != "A" ]]; then
                echo "ERROR: saved photos are immutable; refusing $status $path"
                exit 1
              fi
            done <<< "$photo_changes"
          fi
          history_changes="$(git diff --cached --name-status -- data/history/)"
          if [[ -n "$history_changes" ]]; then
            while IFS=$'\t' read -r status path; do
              if [[ "$status" != "A" ]]; then
                echo "ERROR: data/history is append-only; refusing $status $path"
                exit 1
              fi
            done <<< "$history_changes"
          fi
          if git diff --cached --quiet; then
            echo "Няма промени за публикуване"
          else
            git commit -m "📊 Обяви $(date +'%d.%m.%Y')"
            git push
          fi

      - name: Съдържане на обявите в REMI AI
        env:
          REMI_API_URL: ${{ secrets.REMI_API_URL }}
          REMI_INGESTION_SECRET: ${{ secrets.REMI_INGESTION_SECRET }}
        run: python -u scripts/sync_to_remi.py
