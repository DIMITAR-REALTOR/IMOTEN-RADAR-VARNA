name: Scraper - Вторник и Петък

on:
  schedule:
    - cron: '0 9 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libpangocairo-1.0-0 libcairo2
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        timeout-minutes: 60
        env:
          OLX_EMAIL: ${{ secrets.OLX_EMAIL }}
          OLX_PASSWORD: ${{ secrets.OLX_PASSWORD }}
          OLX_STORAGE_STATE_B64: ${{ secrets.OLX_STORAGE_STATE_B64 }}
          MAX_PAGES: 5
          PYTHONUNBUFFERED: "1"
        run: python -u scraper.py

      - name: Upload OLX login debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-login-debug
          path: |
            data/olx_login_debug.png
            data/olx_login_debug.html
          if-no-files-found: ignore

      - name: Save CSV to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add data/properties_varna.csv
          git diff --cached --quiet || (git commit -m "📊 Обяви $(date +'%d.%m.%Y')" && git push)
