name: REMI historical sync and matching

on:
  push:
    branches:
      - feat/sync-to-remi
    paths:
      - .github/workflows/remi-sync-history.yml

permissions:
  contents: read

jobs:
  sync-history:
    if: "${{ github.event.head_commit.message == 'chore: run REMI historical sync' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current scraper data
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-data

      - name: Checkout sync code from this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: sync-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP client
        run: python -m pip install requests

      - name: Import historical listings and run matching
        env:
          REMI_API_URL: ${{ secrets.REMI_API_URL }}
          REMI_INGESTION_SECRET: ${{ secrets.REMI_INGESTION_SECRET }}
          REMI_CSV_PATH: current-data/data/properties_varna.csv
        run: python sync-code/scripts/sync_to_remi.py
