name: REMI one-listing smoke import

on:
  push:
    branches:
      - feat/sync-to-remi
    paths:
      - .github/workflows/remi-sync-smoke.yml

permissions:
  contents: read

jobs:
  sync-one-current-listing:
    if: "${{ github.event.head_commit.message == 'chore: run one-record REMI smoke import' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current scraper data
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-data

      - name: Checkout sync code from this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: sync-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP client
        run: python -m pip install requests

      - name: Import one current listing without client matching
        env:
          REMI_API_URL: ${{ secrets.REMI_API_URL }}
          REMI_INGESTION_SECRET: ${{ secrets.REMI_INGESTION_SECRET }}
          REMI_CSV_PATH: current-data/data/properties_varna.csv
          REMI_MAX_LISTINGS: "1"
          REMI_SKIP_MATCHING: "1"
        run: python sync-code/scripts/sync_to_remi.py
